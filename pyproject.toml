[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hadan-subscribe"
version = "0.1.0"
description = "Private subscriptions for people and their agents, on one small server"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "httpx>=0.27,<1", "bleach>=6,<7", "cryptography>=44", "python-dotenv>=1,<2", "qrcode>=8,<9", "mcp>=2.1,<3"]

[project.optional-dependencies]
sources = ["playwright>=1.44,<2", "openpyxl>=3.1,<4", "dkimpy>=1.1,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright>=1.44,<2", "openpyxl>=3.1,<4"]

[project.scripts]
hadan = "hadan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hadan = ["schema.sql", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
